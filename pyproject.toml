[project]
name = "telco-cewas"
version = "0.1.0"
description = "Telco Churn Early Warning & Action System"
requires-python = ">=3.12"

# Base: min required in any setting. Heavy-duty bookcases are NOT included here
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "typer>=0.15",
    "structlog>=24.4",
]

[project.scripts]
telco = "telco_cewas.cli:app"

# Matches Compose profiles:
#   default     -> dev     | make sync
#   ml          -> ml      | make sync-ml
#   genai       -> genai   | make sync-genai
[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
]
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "shap>=0.46",
    "optuna>=4.1",
    "mlflow>=2.22,<3",
    "matplotlib>=3.9",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]
genai = [
    "anthropic>=0.40",
    "openai>=1.57",
    "pgvector>=0.3.6",
    "tiktoken>=0.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telco_cewas"]

# ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "ARG", # unused arguments
    "PTH", # pathlib
    "RUF",
]
ignore = ["E501"]  

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

"notebooks/*.ipynb" = [
    "E402", 
    "B018",  
    "F401",  
]

[tool.ruff.format]
quote-style = "double"

# pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires live Postgres/MLflow instance",
]